<!DOCTYPE html>
<html lang='ko'>
<body style='margin:0; padding:0; overflow-x:hidden;'>

  <style>
    /* 기존 */
    .targetText {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 17px;
      line-height: 22px;
      font-weight: bolder;
      letter-spacing: -0.3px;
      color: rgb(0, 104, 195);
      cursor: pointer;
      display: inline;
    }

    /* ✅ 모바일에서 카드가 좁아 보이는 문제 해결 */
    .bgWrap{
      background:rgb(229,243,226);
      color:rgb(15,23,42);
      font-family:'Nanum Square', sans-serif;
      min-height:100vh;
      width:100%;
      box-sizing:border-box;
      padding:20px; /* PC 기본 */
    }
    .containerFix{
      width:100%;
      max-width:960px; /* PC에서는 중앙 정렬 */
      margin:0 auto;
      display:flex;
      flex-direction:column;
      gap:20px;
      box-sizing:border-box;
    }
    .card{
      width:100%;
      box-sizing:border-box;
    }

    /* ✅ 모바일: 화면 꽉 차는 느낌 */
    @media (max-width:520px){
      .bgWrap{ padding:12px; }        /* 8~14px 취향 */
      .containerFix{ max-width:none; } /* 모바일은 가로 꽉 */
    }
  </style>

  <div class='bgWrap' style='background:rgb(229,243,226);'>
    <div class='containerFix'>

      <!-- 알림 -->
      <div class='card' style='display:flex;flex-direction:column;gap:10px;padding:14px 14px;border:1px solid #e5e7eb;border-radius:16px;background:#ffffff;'>
        <div style='display:flex;align-items:center;gap:10px;'>
          <div style='width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:#eef2ff;font-size:18px;'>🧭</div>
          <div style='font-size:16px;font-weight:900;line-height:1.25;'>
            20~30초면 끝! <span style='color:#2563eb;'>복사한 링크</span>만 제출하면 돼요
          </div>
        </div>

        <div style='display:flex;flex-wrap:wrap;gap:8px;'>
          <div style='display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;border:1px solid #FDE68A;background:#FFFBEB;font-size:12px;color:#92400E;'>
            <span style='font-size:14px; line-height:1; color:#0f172a;'>⏱</span> 소요시간 <b style='color:#78350F;'>20~30초</b>
          </div>
          <div style='display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;border:1px solid #bbf7d0;background:#eaf9ef;font-size:12px;color:#166534;'>
            ✅ 난이도 <b>쉬움</b>
          </div>
          <div style='display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;border:1px solid #c7d2fe;background:#e8f0ff;font-size:12px;color:#1e40af;'>
            💰 정답 일치 시 <b>즉시 지급</b>
          </div>
        </div>
      </div>

      <!-- 상단 이미지 -->
      <img src='https://raw.githubusercontent.com/kihirimi/imgMissionwoman/main/plan_woman3.png'
           alt='검색 예시'
           style='display:block;width:100%;height:auto;margin:0 auto;border-radius:14px;'>

      <!-- 타이틀 -->
      <div style='display:flex;align-items:center;gap:12px; margin-bottom:20px;'>
        <div style='width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;'>💰</div>
        <div style='font-size:22px;font-weight:800;color:#1e293b;'>플레이스 찾기 미션 안내</div>
      </div>

      <!-- STEP 1 -->
      <div style='width:28px;height:28px;background:#1e293b;color:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;margin-bottom:3px;'>1</div>

      <div class='card' style='background:#F8FAFC;border-radius:12px;padding:16px 18px;border:2.5px solid #e5e7eb; margin-bottom: 10px;'>
        <div style='display:flex;flex-direction:column;gap:6px;'>
          <div style='display:flex;align-items:center;gap:4px;flex-wrap:nowrap;min-width:0;'>
            <img src='https://raw.githubusercontent.com/unembabo/images/refs/heads/main/findanswer/missionStart22.png'
                 alt=''
                 style='flex:0.6 1 0;min-width:0;height:auto;border-radius:4px;object-fit:contain;'>
            <span style='font-size:13px;color:#334155;'>클릭</span>
          </div>
        </div>
      </div>

      <!-- STEP 2 -->
      <div style='width:28px;height:28px;background:#1e293b;color:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;margin-bottom:3px;'>2</div>

      <div class='card' style='background:#F8FAFC;border-radius:12px;padding:16px;border:3.5px solid #e5e7eb; margin-bottom: 10px;'>
        <div style='font-size:14px;font-weight:700;color:#1e293b;margin-bottom:10px;'>
          <div style='font-size:15px;font-weight:500;line-height:1.3;margin-bottom:15px;'>
            <span style='font-weight:300;color:black;font-size:13px;'>본문내용의 </span>
            <span style='color:black;font-weight:bold;font-size:13px;'>추천장소 지도</span>
            <span style='font-weight:300;color:black;font-size:13px;'> 클릭</span>
          </div>
        </div>

        <div style='border-radius:10px;overflow:hidden;border:1px solid #e5e7eb;background:#fff;padding:6px;'>
          <img src='https://raw.githubusercontent.com/unembabo/images/refs/heads/main/blogMission/map3.png'
               alt='추천 장소 지도 예시'
               style='width:100%;height:auto;display:block;'>
        </div>
      </div>

      <!-- STEP 3 -->
      <div style='width:28px;height:28px;background:#1e293b;color:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;margin-bottom:3px;'>3</div>

      <div class='card' style='background:#F8FAFC;border-radius:12px;padding:16px 18px;border:2.5px solid #e5e7eb; margin-bottom: 10px;'>
        <div>

          <div style='font-size:15px;font-weight:500;line-height:1.3;margin-bottom:4px;'>
            <span style='font-weight:300;color:black;font-size:13px;'>아래 </span>

            <span style='
              display:inline-flex;
              align-items:center;
              vertical-align:middle;
              padding:7px 0px 7px 9px;
              border-radius:19px;
              font-family:Pretendard;
              font-size:14px;
              line-height:10px;
              white-space:nowrap;
              color:rgba(85,85,88,1);
            '>
              <span style='
                width:25px;
                height:25px;
                margin-right:0px;
                display:inline-flex;
                align-items:center;
                justify-content:center;
                position:relative;
                top:-5px;
              '>
                <img src='https://raw.githubusercontent.com/unembabo/images/refs/heads/main/findanswer/accent-teamreader.png'
                     alt='전화'
                     style='width:100%;height:100%;margin:0;display:block;object-fit:contain;'>
              </span>
            </span><span style='font-weight:700;color:#0f172a;font-size:14px;'>미션 질문</span>
            <span style='font-weight:300;color:black;font-size:13px;'> 에 따라 </span>
            <span style='color:black;font-weight:bold;font-size:13px;'>순서대로 클릭</span>
            <span style='font-weight:300;color:black;font-size:13px;'> 후,</span>
          </div>

          <div style='text-align:right;'>
            <span style='font-size:13px;font-weight:425;color:black;'>복사된</span>
            <span style='font-weight:900;font-size:13px;color:rgb(255,0,0);'>최종 링크</span>
            <span style='font-weight:300;color:black;font-size:12px;white-space:nowrap;'>를</span>

            <span style='
              width:90px;
              height:25px;
              margin-right:4px;
              display:inline-flex;
              align-items:center;
              justify-content:center;
              position:relative;
              top:3px;
            '>
              <img src='https://raw.githubusercontent.com/unembabo/images/refs/heads/main/findanswer/answer_submit.png'
                   alt='제출'
                   style='width:100%;height:100%;margin:0;display:block;object-fit:contain;'>
            </span>
          </div>

          <div style='margin-top:10px;font-size:13px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:2px 8px 3px;color:#1e40af;display:inline-flex;align-items:center;gap:4px;'>
            <span style='font-size:13px;font-weight:900;color:#1e40af;'>※</span>
            <span style='font-size:10px;font-weight:400;color:#000;'>미션 질문 단계 건너뛰고 수행하면 <span style='font-weight:bold;'>정답오류</span></span>
          </div>

        </div>
      </div>

      <!-- 미션질문 참고 이미지 -->
      <div style='width:28px;height:28px;background:#1e293b;color:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;margin-bottom:3px;'>#</div>

      <div class='card' style='background:rgb(226,225,225);border-radius:12px;padding:16px;border:3.5px solid #e5e7eb; margin-bottom: 10px;'>
        <div style='font-size:16px;font-weight:800;margin-bottom:4px;color:#1f2937;'>미션질문 참고 이미지</div>
        <div style='font-size:13px;color:#374151;margin-bottom:14px;'>버튼 위치를 확인할 때 참고해 주세요</div>

        <div style='display:grid;grid-template-columns:0.9fr 1fr;gap:14px;align-items:start;'>

          <div style='grid-column:1 / -1;font-size:10.5px;font-weight:800;color:#1d4ed8;line-height:1.25;margin-bottom:-7px;white-space:normal;word-break:keep-all;'>
            [리뷰탭- 방문자리뷰- 메뉴:대게- 최신순]
          </div>

          <div>
            <div style='border-radius:10px;overflow:hidden;border:1px solid #e5e7eb;background:#fff;padding:6px;'>
              <img src='https://raw.githubusercontent.com/unembabo/images/refs/heads/main/findanswer/review_teamleader.png'
                   alt=''
                   style='width:100%;height:auto;display:block;'>
            </div>
          </div>

          <div style='margin-top:13px;'>
            <div style='font-size:12px;font-weight:700;color:#1d4ed8;margin-bottom:6px;margin-top:2px;'>[사진탭- 내부버튼]</div>
            <div style='border-radius:10px;overflow:hidden;border:1px solid #e5e7eb;background:rgb(240,243,226);'>
              <img src='https://raw.githubusercontent.com/unembabo/images/refs/heads/main/findanswer/place_picture5.png'
                   alt=''
                   style='width:100%;height:auto;display:block;'>
            </div>

            <div style='margin-top:12px;'>
              <div style='font-size:12px;font-weight:700;color:#1d4ed8;margin-bottom:6px;'>[공유하기-URL복사버튼]</div>
              <div style='border-radius:10px;overflow:hidden;border:1px solid #e5e7eb;background:rgb(240,243,226);'>
                <img src='https://raw.githubusercontent.com/unembabo/images/refs/heads/main/findanswer/source_share.png'
                     alt=''
                     style='width:100%;height:auto;display:block;'>
              </div>
            </div>
          </div>

          <div style='grid-column:1 / -1;'>
            <div style='font-size:12px;font-weight:700;color:#1d4ed8;margin-bottom:6px;'>[길찾기- 추천거리]</div>
            <div style='border-radius:10px;overflow:hidden;border:1px solid #e5e7eb;background:#fff;width:90%;margin:0 auto;'>
              <img src='https://raw.githubusercontent.com/unembabo/images/refs/heads/main/findanswer/cutting22.png'
                   alt=''
                   style='width:100%;height:auto;display:block;'>
            </div>
          </div>

        </div>
      </div>

    </div><!-- containerFix -->
  </div><!-- bgWrap -->

</body>
</html>
