<!DOCTYPE html>
<html lang='ko'>

<body style='margin:0; padding:0; overflow-x:hidden;'>
  <style>
    html,
    body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      background: rgb(229, 243, 226) !important;
      overflow-x: hidden !important;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box !important;
    }

    img,
    svg,
    video,
    canvas {
      max-width: 100% !important;
      height: auto !important;
    }

    .targetText {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 17px;
      line-height: 22px;
      font-weight: bolder;
      letter-spacing: -0.3px;
      color: rgb(0, 104, 195);
      cursor: pointer;
      display: inline;
    }

    .bgWrap {
      background: rgb(229, 243, 226) !important;
      color: rgb(15, 23, 42);
      font-family: 'Nanum Square', sans-serif;
      min-height: 100vh;
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }

    .containerFix {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      width: 100%;
    }

    @media (max-width:520px) {
      .bgWrap {
        padding: 12px;
      }

      .containerFix {
        max-width: none;
      }
    }
  </style>

  <div class='bgWrap' style='

  color:rgb(15,23,42);

  margin-right:-20px;

  padding-left:20px;
  padding-right:20px;

  padding-top:20px;
  padding-bottom:20px;

'>

      <div class='card' style='
  display:flex;
  flex-direction:column;
  gap:6px;
 padding:10px 12px 10px 8px;
  border:1px solid #e5e7eb;
  border-radius:14px;
  background:#ffffff;
'>

        <div style='display:flex;align-items:center;gap:8px;min-width:0;'>

'>

            <div style='
        border-radius:10px;

        border:1px solid #e5e7eb;
        background:rgb(240,243,226);
        box-sizing:border-box;
      '>
              <img src='https://raw.githubusercontent.com/unembabo/images/refs/heads/main/findanswer/place_picture5.png'
